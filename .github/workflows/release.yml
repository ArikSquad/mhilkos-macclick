name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example, v0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a prerelease"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: macclik-linux-x86_64.tar.gz
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            archive: macclik-macos-intel.zip
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            archive: macclik-macos-apple-silicon.zip
          - name: Windows x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            archive: macclik-windows-x86_64.zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxi-dev libxtst-dev libxcb1-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Linux
        if: runner.os == 'Linux'
        run: tar -C target/${{ matrix.target }}/release -czf ${{ matrix.archive }} macclik
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p MacClik.app/Contents/MacOS
          cp target/${{ matrix.target }}/release/macclik MacClik.app/Contents/MacOS/macclik
          cp packaging/macos/Info.plist MacClik.app/Contents/Info.plist
          ditto -c -k --keepParent MacClik.app ${{ matrix.archive }}
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/macclik.exe -DestinationPath ${{ matrix.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          files: dist/*
